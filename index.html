<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜问卷 · 关于你的一切</title>
<style>
  :root {
    --bg: #F2F0F5;
    --card: #FFFFFF;
    --accent: #8B6FA6;
    --accent-light: #EDE8F4;
    --text: #1C1C1E;
    --sub: #6B6475;
    --border: #E2DCE9;
    --ghost: rgba(139,111,166,0.07);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(175deg, #FFFFFF 60%, #F7F3FA);
    border-bottom: 1px solid var(--border);
    padding: 64px 24px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "?";
    position: absolute;
    font-size: 320px;
    font-weight: 900;
    color: var(--ghost);
    top: -60px; right: -30px;
    line-height: 1;
    pointer-events: none;
  }
  .hero-tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .hero h1 { font-size: clamp(28px,6vw,44px); font-weight: 300; letter-spacing: 0.05em; margin-bottom: 12px; }
  .hero h1 strong { font-weight: 700; color: var(--accent); }
  .hero p { color: var(--sub); font-size: 14px; max-width: 360px; margin: 0 auto 32px; line-height: 1.8; }
  .hero-meta { display: flex; justify-content: center; gap: 32px; font-size: 12px; color: var(--sub); }
  .hero-meta span strong { display: block; font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .progress-bar { height: 3px; background: var(--border); position: sticky; top: 0; z-index: 100; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #C4A0DC); width: 0%; transition: width 0.3s ease; }
  .container { max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
  .section { margin-bottom: 48px; border-radius: 20px; padding: 20px 10px 8px; }
  .section.sec-0 { background: linear-gradient(180deg, rgba(139,111,166,0.055), rgba(139,111,166,0.015)); }
  .section.sec-1 { background: linear-gradient(180deg, rgba(116,110,178,0.06), rgba(116,110,178,0.015)); }
  .section.sec-2 { background: linear-gradient(180deg, rgba(158,102,150,0.06), rgba(158,102,150,0.015)); }
  .section-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding: 0 4px; }
  .section-num { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sec-1 .section-num { background: #746EB2; }
  .sec-2 .section-num { background: #9E6696; }
  .section-title { font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
  .section-desc { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .q-card { background: var(--card); border-radius: var(--radius); padding: 22px 22px 18px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; }
  .q-card.answered { border-color: rgba(139,111,166,0.4); box-shadow: 0 1px 8px rgba(139,111,166,0.07); }
  .q-ghost-num { position: absolute; right: 14px; top: 6px; font-size: 48px; font-weight: 900; color: rgba(139,111,166,0.08); line-height: 1; pointer-events: none; }
  .q-label { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  .q-num-badge { background: var(--accent-light); color: var(--accent); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; margin-top: 3px; flex-shrink: 0; }
  .q-text { font-size: 14px; color: var(--text); line-height: 1.65; }
  .options { display: flex; flex-direction: column; gap: 7px; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 13.5px; color: var(--sub); background: var(--bg); user-select: none; }
  .opt:hover { border-color: var(--accent); color: var(--text); background: white; }
  .opt.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .opt-letter { font-weight: 700; flex-shrink: 0; opacity: 0.7; font-size: 12px; margin-top: 1px; }
  .opt.selected .opt-letter { opacity: 1; }
  .opt-check { margin-left: auto; font-size: 12px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; margin-top: 1px; }
  .opt.selected .opt-check { opacity: 0.9; }
  .actions { margin-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .btn-primary { background: var(--accent); color: white; border: none; border-radius: 50px; padding: 16px 48px; font-size: 16px; font-family: inherit; font-weight: 600; cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.2s, transform 0.1s; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.97); }
  .actions-note { font-size: 12px; color: var(--sub); text-align: center; }
  .progress-count { font-size: 13px; color: var(--accent); font-weight: 600; }
  #resultSection { display: none; margin-top: 48px; }
  .result-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 6px 32px rgba(60,40,90,0.10); }
  .result-head { padding: 34px 28px 26px; color: white; }
  .result-head-tag { font-size: 11px; letter-spacing: 0.14em; opacity: 0.75; margin-bottom: 10px; }
  .result-head h2 { font-size: 27px; font-weight: 700; line-height: 1.3; }
  .song-line { margin-top: 14px; font-size: 12.5px; letter-spacing: 0.06em; opacity: 0.88; display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.16); padding: 5px 13px; border-radius: 20px; }
  .result-body { padding: 30px 28px 26px; background: linear-gradient(180deg, #FFFFFF, #FBF9FD); }
  .mod-block { margin-bottom: 26px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .mod-chip { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 11px; border-radius: 6px; margin-bottom: 11px; }
  .mod-text { font-size: 14.5px; line-height: 1.9; color: var(--text); text-align: justify; }
  .lit-text { font-size: 15px; line-height: 2.05; color: var(--text); margin-bottom: 26px; text-align: justify; }
  .plain-card { background: linear-gradient(135deg, var(--accent-light), #F5EFFA); border: 1px solid rgba(139,111,166,0.28); border-radius: 14px; padding: 20px 22px; font-size: 15px; line-height: 1.85; color: var(--accent); font-weight: 600; margin-bottom: 30px; position: relative; }
  .plain-card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--accent); opacity: 0.55; }
  .axis-bars { display: flex; flex-direction: column; gap: 18px; padding: 8px 6px 10px; }
  .axis-bar { position: relative; height: 3px; background: var(--border); border-radius: 2px; }
  .axis-dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 0 3px rgba(139,111,166,0.14); }
  .regen-row { display: flex; justify-content: center; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn-regen { background: none; border: 1px solid var(--border); border-radius: 50px; padding: 10px 24px; font-size: 13px; font-family: inherit; color: var(--sub); cursor: pointer; transition: border-color 0.2s, color 0.2s; }
  .btn-regen:hover { border-color: var(--accent); color: var(--accent); }
  .float-nav { position: fixed; right: 14px; bottom: 84px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
  .float-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: rgba(255,255,255,0.92); color: var(--accent); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 14px rgba(60,40,90,0.14); transition: transform 0.15s, background 0.2s; backdrop-filter: blur(4px); }
  .float-btn:hover { background: var(--accent-light); transform: translateY(-2px); }
  .float-btn:active { transform: scale(0.94); }
  @media(max-width:480px){
    .hero{padding:48px 20px 36px;}
    .q-card{padding:16px 14px 14px;}
    .hero-meta{gap:20px;}
    .result-head{padding:24px 20px 20px;}
    .result-body{padding:22px 18px 20px;}
    .section{padding:14px 6px 4px;}
    .float-nav{right:10px;bottom:70px;}
    .float-btn{width:38px;height:38px;font-size:15px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">PERSONALITY TEST · 人格测试</div>
  <h1>深夜<strong>问卷</strong></h1>
  <p>七十道选择题，关于爱、关于你、关于我们之间。<br>选最接近真实的，一个或几个都行。</p>
  <div class="hero-meta">
    <span><strong>70</strong>道题</span>
    <span><strong>3</strong>个章节</span>
    <span><strong>27</strong>种结果</span>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="container" id="app"></div>

<div class="float-nav">
  <button class="float-btn" title="回到顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <button class="float-btn" title="去到末尾" onclick="window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'})">↓</button>
</div>

<script>
const DATA = {"QS":[{"t":"当激情褪去，支撑爱情继续的核心是什么？","o":["习惯和陪伴，在一起久了就是家人","共同成长，互相让对方变得更好","深度的理解和精神共鸣","说实话，不太确定，可能顺其自然"]},{"t":"能接受感情里有私人空间吗？","o":["完全接受，各自有空间才健康","接受，但想大概知道边界在哪","有点难，会忍不住想多了解对方","不太接受，感情就该全力投入"]},{"t":"恋爱里能接受几天不联系？","o":["1天都很难受","2-3天勉强可以","一周以内没问题","随缘，信任对方就够了"]},{"t":"自认为在亲密关系里是粘人的人吗？","o":["是，需要持续的回应和陪伴","有点，但会努力控制","不算，比较独立","完全不粘，反而需要自己的空间"]},{"t":"对\"绿茶\"这件事的看法？","o":["非常反感，最讨厌这类行为","理解但不认可，也是一种生存方式","无所谓，和自己没关系","某种程度觉得自己也有一点点"]},{"t":"会对怎样的人一眼心动？","o":["外貌，第一印象很重要","气质或眼神，说不清但能感觉到","幽默有趣，让人放松的类型","有神秘感，让自己想主动靠近的"]},{"t":"感情里，成长重要还是陪伴重要？","o":["陪伴更重要，在一起才是核心","成长更重要，不能原地踏步","两者缺一不可","看阶段，不同时期需求不同"]},{"t":"恋爱后会有意识地和他人保持距离吗？","o":["会，主动减少与异性单独相处","会，但更多是自然而然地减少","不太会，信任自己也信任对方","不会，让对方自己判断"]},{"t":"如何界定亲密需求和个人边界？","o":["亲密需求优先，感情里要全力投入","边界优先，自己舒服才能给对方好感情","动态平衡，根据对方需求调整","一直在摸索，没有明确答案"]},{"t":"感情滤镜是好是坏？","o":["好，让感情更美好更值得维系","坏，清醒认识对方才是基础","前期需要，后期要慢慢还原","无法控制，来了就接受"]},{"t":"良好的感情最需要什么？","o":["信任和安全感","共同的价值观和目标","持续的吸引力和新鲜感","彼此保有足够的自由空间"]},{"t":"遇到信任危机，会怎么做？","o":["直接当面谈清楚","先自己消化，再考虑是否沟通","查证清楚再做决定","很难处理，情绪可能直接崩溃"]},{"t":"感情里\"喜恶同因\"——爱一个人的原因也是被伤害的来源？","o":["完全理解，这是感情的本质","觉得是个陷阱，要警惕","没深想过，但好像确实如此","不认同，喜欢和讨厌是不同的事"]},{"t":"选择你爱的还是爱你的？","o":["选我爱的，否则委屈对方","选爱我的，被爱更稳定","两者都有才选，否则不选","随缘，缘分到了自然知道"]},{"t":"理想另一半的外貌？","o":["颜值是硬条件，不好看很难喜欢","不要求帅美，但要有自己的风格","整体气质更重要，颜值是加分项","外貌排最后，内在更重要"]},{"t":"哪件事让你觉得对方有在重视你？","o":["主动记住你说过的细节","在你最需要的时候出现","愿意为你改变某些习惯","在外人面前维护你"]},{"t":"觉得自己是哪种依恋类型？","o":["焦虑型，容易没有安全感","回避型，需要多一点距离","安全型，状态比较稳定","恐惧型，想靠近又怕受伤"]},{"t":"如果对方太粘、太依赖，会怎么做？","o":["纵容，喜欢被需要的感觉","接受但慢慢引导对方独立","直接说出来，需要对方调整","感到窒息，可能因此拉开距离"]},{"t":"你的朋友圈通常是？","o":["少而精，只有几个真心的","比较广，各种类型的都有","随缘，不刻意维系","以所在圈子为主"]},{"t":"讨厌一个人通常是因为？","o":["虚伪，表里不一","没有边界感，让人不舒服","价值观不同，无法沟通","做过伤害自己或身边人的事"]},{"t":"两个朋友分手并让你站队，会怎么做？","o":["拒绝站队，两边都是朋友","站感觉更受伤的那一边","站和自己更亲近的那一边","具体分析，看谁有问题"]},{"t":"理想的人生状态？","o":["自由，不受拘束，做自己想做的事","稳定，有爱的人陪，有安全感","有成就感，事业上有所成","平衡，工作感情生活都不偏废"]},{"t":"朋友和暧昧对象的边界在哪？","o":["心动，有没有那种感觉","行为，有没有超过朋友的举动","其实很难划分，经常模糊","说开了就是朋友，没说开就算暧昧"]},{"t":"认识很久的朋友喜欢自己，会怎么做？","o":["如果有感觉，认真考虑","明确拒绝，保护对方也保护自己","先装不知道，给双方缓冲","很纠结，怕破坏友情"]},{"t":"旅行偏好？","o":["自然风景，安静的地方","城市探索，体验当地文化","说走就走，目的地不重要","和喜欢的人一起，去哪都好"]},{"t":"对星座这件事的态度？","o":["信，星座说的很准","娱乐一下，不深信","不信，太笼统了","只看自己喜欢看的结论"]},{"t":"最讨厌哪类人？","o":["爱占便宜、算计别人的","喜欢控制他人的","假装亲密实则疏远的","负能量很重、影响周围人情绪的"]},{"t":"路上遇到乞讨的老人，会给钱吗？","o":["会，看到就给，不想多想","要看情况，感觉可信就给","一般不给，担心被骗","每次都很纠结，内心挣扎"]},{"t":"白衬衫有洗不净的小污渍，会继续穿吗？","o":["绝对不穿，有强迫症","看污渍大小和场合决定","无所谓，直接穿了","纠结一下，但最终穿了"]},{"t":"对化妆的看法？","o":["喜欢，化妆是给自己的仪式感","需要的场合才化，日常素颜","不太化，嫌麻烦","随心情，想化就化"]},{"t":"近期最喜欢的一句话，通常属于哪类？","o":["关于爱和关系的","关于人生和自由的","有点丧但很戳心的","励志或哲学类的"]},{"t":"发呆的时候通常在想什么？","o":["某个人或某段关系","未来，规划或担忧","什么都不想，完全放空","奇奇怪怪的脑洞"]},{"t":"很疲惫回家，会先做什么？","o":["直接倒在床上，什么都不管","洗个澡，先恢复状态","坐着发一会儿呆","吃东西或者刷手机"]},{"t":"有什么他人不理解但自己很喜欢的怪癖？","o":["收集或囤积某类东西","睡前或起床有固定仪式","对某些细节有强迫症","会自言自语或者独自大笑"]},{"t":"对自己打分，满分十分？","o":["8分以上，比较自信","6-7分，有不足但还行","刚好5分，及格线","5分以下，很不满意自己"]},{"t":"对自己最满意的特质？","o":["外貌或形象","聪明或有能力","善良或高情商","独立或有想法"]},{"t":"对自己最不满意的地方？","o":["外貌或身材","不够努力或自律","情绪管理有问题","在关系里太在意别人"]},{"t":"对同居的看法？","o":["支持，喜欢有人陪的感觉","支持，但需要各自保有独立空间","谨慎，同居会暴露很多问题","不太想同居，需要自己的领地"]},{"t":"有吸引力的人来搭讪，会给联系方式吗？","o":["会，先聊聊看","要看当时的感觉和对方类型","委婉拒绝","看自己是否单身，单身就给"]},{"t":"团体和谐重要，还是团体给你带来的价值重要？","o":["和谐更重要，氛围不好什么都做不了","价值更重要，没收获就没意义","两者都要，缺一不可","其实更偏好独自工作"]},{"t":"存款多少可以摆烂？","o":["够用3-5年就行","财务彻底自由才行","没这个想法，喜欢有事情做","现在就想摆烂，只是不敢"]},{"t":"出远门认床吗？","o":["严重认床，很难睡好","轻微，适应一两天就好","完全不认床","要看有没有熟悉的人陪着"]},{"t":"想念一个人想到难以忍受，会怎么做？","o":["主动联系对方","忍着，不想让对方觉得自己粘","找朋友转移注意力","一个人消化，等时间慢慢冲淡"]},{"t":"有没有遇到过让你心跳加速的类型？","o":["有，感觉非常强烈","有过，但不算太强烈","一直在找，还没遇到","对这种心跳感有点不信任"]},{"t":"能接受柏拉图式关系吗？","o":["可以，精神连接有时比什么都重要","不行，感情里身体部分同样重要","短期可以，长期很难","看对象，对某些人可以"]},{"t":"如果喜欢的人和自己取向不匹配，会怎么做？","o":["放弃，强求没意义","会试着争取，但不强迫","默默喜欢就好，不说","很难受，但最终接受现实"]},{"t":"在亲密关系里，你更偏主动还是被动？","o":["主动，喜欢掌控节奏","被动，喜欢被牵着走","灵活，根据对方调整","说不清楚，看感情到哪个阶段了"]},{"t":"在某段关系或圈子里有没有感到被冒犯过？","o":["有，对方完全越界了","有，但不严重，忽略了","没有，一直比较顺利","有，但当时没意识到，后来才明白"]},{"t":"如果喜欢的人和你有很相似的特质，会？","o":["更喜欢，感觉找到同类","有点不确定，太像会不会无聊","取决于哪方面相似","一般更喜欢跟自己互补的人"]},{"t":"对不那么严肃的亲密关系的看法？","o":["接受，双方清楚就好","不接受，亲密关系需要认真对待","理解但自己做不到","曾经可以，现在只想要认真的"]},{"t":"如果条件不差，为什么还是会拼命工作？","o":["喜欢那种拼劲和成就感","不想依赖任何人，靠自己更安心","有想实现的目标在推着走","闲下来反而焦虑，需要忙碌"]},{"t":"向别人介绍重要的关系时，会怎么说？","o":["直接说\"这是我男/女朋友\"","看场合，不是所有人都需要知道","顺着对方介绍的方式走","用模糊方式处理，不喜欢定义"]},{"t":"工作里遇到冲突，怎么处理？","o":["直接当面说清楚","找合适时机再谈","忍了，避免正面冲突","看情况，严重了就换环境"]},{"t":"职场上有没有感到被针对过？","o":["有，很不舒服","有，但选择无视","没有，关系一直不错","不确定，可能有但没意识到"]},{"t":"觉得自己受欢迎吗？","o":["是，比较受欢迎","在某些圈子里是，不是全部","不太觉得，比较普通","不在意这件事"]},{"t":"对圈内谈恋爱的看法？","o":["不建议，分手了很尴尬","无所谓，跟着感觉走","可以，但要提前想清楚后果","支持，共同圈子有更多共鸣"]},{"t":"什么状态下会觉得特别想靠近某人？","o":["对方展现出脆弱或真实的一面","对方在某件事上表现特别好","特定的氛围或场合","长时间相处积累出来的感情"]},{"t":"如果发现上级喜欢上了你，会怎么做？","o":["明确拒绝，划清界限","装不知道，当没这回事","视情况，如果也有感觉另说","感到压力，选择回避"]},{"t":"这份问卷里哪类问题最难回答？","o":["关于感情状态的","关于自我认知和评价的","关于我们之间关系的","关于私密偏好的"]},{"t":"一段感情陷入危机，你会怎么做？","o":["主动挽回，开口说清楚","等对方先开口","给彼此冷静时间","不擅长处理，会选择回避"]},{"t":"上一段重要感情或暧昧留给你最大的影响是？","o":["更了解自己需要什么","对感情有了一定戒备","学会了怎么更好地相处","留下了一些没解开的心结"]},{"t":"最不想让重要的人看到自己的哪一面？","o":["情绪崩溃或很脆弱的时候","在某件事上表现很差劲的时候","对某些人或事的真实态度","其实没什么特别不想被看见的"]},{"t":"有没有害怕过被人彻底看穿后反而失去吸引力？","o":["有，神秘感很重要","有过，但后来想开了","没有，被看穿才是真正的亲密","没想清楚过这个问题"]},{"t":"愧疚和遗憾，哪个更难以忍受？","o":["愧疚，因为是自己的错","遗憾，因为无法改变","差不多，都很难","都能放下，不太纠结"]},{"t":"如果和一个人说了再见但很舍不得，会怎么做？","o":["说了再见就是结束，强迫自己放手","忍不住还是会联系","留着联系方式，但不主动","靠时间慢慢冲淡"]},{"t":"暧昧和恋爱的区别在哪？","o":["一个名分，说开了就是恋爱","深度和责任感，恋爱要承担更多","稳定性，暧昧是流动的","没什么本质区别，只是阶段不同"]},{"t":"有没有某段关系里表面和好但心里有结？","o":["有，一直没能真正和解","有过，但后来解开了","没有，说开了就彻底好了","不太记得了"]},{"t":"在一段重要的感情里，最大的感悟是？","o":["感情要双向，单方面很累","要先爱好自己才能爱别人","缘分这件事真的说不清楚","沟通比什么都重要"]},{"t":"感情有没有改变过你？","o":["有，变得更柔软了","有，但也带来了一些伤痕","变化不大，还是原来的自己","改变了很多，好坏都有"]},{"t":"你的审美偏好更偏向？","o":["反差感，外冷内热或反过来","温柔型，安全感强的","帅气利落型","说不清楚，看整体感觉"]}],"VOTES":[[["温度:清醒"],["温度:清醒"],["温度:炽热"],["温度:观望"]],[["浓度:疏离"],["浓度:弹性"],["浓度:贴近"],["浓度:贴近"]],[["浓度:贴近"],["浓度:弹性"],["浓度:疏离"],["浓度:疏离"]],[["浓度:贴近"],["浓度:弹性"],["浓度:弹性"],["浓度:疏离"]],[["温度:炽热"],["温度:清醒"],["温度:观望"],["温度:清醒", 外放"],["情绪:悬置"],["情绪:悬置"]],[[],["温度:清醒"],["温度:观望"],["温度:观望"]],[["情绪:悬置"],[],["情绪:外放"],["情绪:悬置"]],[[],["浓度:弹性"],[],["情绪:外放"]],[["温度:炽热"],["温度:观望"],["温度:清醒"],["温度:炽热"]],[["温度:炽热"],["温度:炽热","浓度:贴近"],["温度:清醒"],[]]],"PROFILES":{"贴近-外放-炽热":{"title":"朝太阳直飞的人","lit":"伊卡洛斯的问题从来不在飞这件事。翅膀是蜡做的又怎样，太阳在那里，他就要去。你爱一个人也是满城皆知的飞法。想见就说想见，难过当场就红眼眶，从不把心放凉了再端出来。蜡会化，海会疼，可俯冲过的天空都记得你来过。","plain":"你爱谁，全世界都会先于那个人知道。","song":"梁静茹《勇气》","gradient":"linear-gradient(135deg,#C4455C,#E8875A)","p1":"爱一个人的时候，你从不留后手。你的心里一有波动，脸上立刻有回应。喜欢就凑近，难过就当场掉眼泪，情绪从不等第二天表露补救。这份直接使得身边的人很少猜错你的心思，但也让你自己容易受伤，因为你提前烧掉了所有退路。可你并不后悔，哪怕翅膀化了，至少你也飞过。那段俯冲的时间里，全世界都看得见你有多认真。","p2":"你需要一个敢跟你一起把话说满、看到你冲动也不急着泼冷水的人，他能听懂你的直白，也愿意用同样的坦率回应你，不躲在礼貌后面观察。不适合习惯算计、凡事先估算风险再决定投入多少的人，你们的节奏会互相消耗。也就是说，你要找的是一个愿意和你一起往前冲、陪你飞的伴侣，站在安全线外看戏的旁观者留不住你。"},"贴近-外放-清醒":{"title":"布衣菜饭也可乐的人","lit":"沈复写芸娘，最动人的地方无关浪漫，是那句\"布衣菜饭，可乐终身\"。她想看庙会就换男装同去，一碟腐乳也能吃出滋味来。你要的亲密就是这种。人要在身边，话要说在明处，日子要过得起推敲。你的爱不悬在天上，它坐在对面，陪你把一碗粥喝完。","plain":"你要的不是烟花，是一个能天天说话的人。","song":"张学友《每天爱你多一些》","gradient":"linear-gradient(135deg,#B56576,#E5989B)","p1":"你对感情的想象很朴素，不需要惊喜连连，只求有人陪你把普通日子过完整。一顿饭、一句闲话、一次并肩逛街，这些小事对你来说比礼物更值钱。你话说得直率，心思也摊在明面上，不需要对方来猜。但正因为你把标准定得这么低，反而让人容易忽略你其实需求很高。因为这些特质意味着，你认定的伴侣得一直在，且得一直愿意聊。","p2":"把日常过得认真、不嫌腐乳配粥太寒酸的人最合你的拍，他重视陪伴胜过排场，说话直来直去，能陪你笑你随口的玩笑，也能陪你处理鸡毛蒜皮。不适合把感情当仪式表演、只在纪念日出现、平常疏于联系的人，他给的热闹撑不起你要的长久。你要的是一个能一起把日子过下去的人，不是一个偶尔来访的客人。"},"贴近-外放-观望":{"title":"潇湘馆里验金的人","lit":"黛玉的每一次使小性子，其实都是在验金。她把宝玉说的话拿出来烧一烧、敲一敲，看是真金还是镀的。要人陪是真的，眼泪掉在明处也是真的，只有\"信\"这个字，她迟迟不敢给出。你也是，对你来说，闹当面闹，好当面好，唯独真心要验过许多回才肯相信。会验金是聪明人保护真心的手艺，只是记得，验完了要收货。","plain":"你不是难哄，你是还没验完货。","song":"蔡健雅《达尔文》","gradient":"linear-gradient(135deg,#A4508B,#D67BA8)","p1":"你聪明，也谨慎，对一段感情从不急着盖章确认。眼泪可以当场掉，小性子可以当面使，但信任你要反复核对后才能建立。你太清楚人心会变，宁可多花些心思去辨认真假，也不愿意稀里糊涂交出自己。但这份反复只是你保护真心的方式，你的每一次试探都是认真的，因为你只想把真心留给经得起检验的人。","p2":"能耐心接受被你反复确认、愿意用行动而非空话证明自己的人，他经得起时间的推敲，也不会因为你的谨慎而不耐烦。至于嫌你麻烦、说一次就要求你立刻全信的人，别在他身上花耐心，他等不到你伸出信任的触角就会先走。你需要的人会明白你的认真，也知道通过你的标准后，你交出去的是真心。"},"贴近-内收-炽热":{"title":"借回声说爱的人","lit":"宁芙厄科被罚不能先开口，只能重复别人的尾音，可她照样追着纳西索斯跑遍了山谷。你懂这种委屈。你也是一步不落地跟着的，心是烧得最旺的，可你的话却要在肚子里绕过九曲十八弯，出口时只剩轻轻一句\"嗯，我也是\"。但请记得，山谷里最后留下来的是她的声音。藏得再深的爱，也有回音。","plain":"你的\"我也是\"，其实是一整座山谷的\"我爱你\"。","song":"杨宗纬《洋葱》","gradient":"linear-gradient(135deg,#B0413E,#D98E73)","p1":"你的心动来得又快又猛，脚步比嘴巴诚实得多，人早就追过去了，话却卡在喉咙里出不来。你能做的最大表达常常只是一句轻飘飘的\"嗯，我也是\"，可那句话背后是翻涌了很久的心事。你不擅长主动开口，却擅长用陪伴证明自己没有走。旁人容易看轻你的沉默，其实你藏起来的比说出来的多得多。","p2":"愿意多问一句、听得懂你欲言又止的人，是你该留住的人，他不会逼你把话全说完，而是从行动里读出你的认真，给你留出慢慢开口的空间。非要你嘴上说清楚、否则就认定你不在乎的人，趁早离远一点，他等不到回音就会转身离开。你需要一个愿意陪你把话一点点说出来的人，光听得懂声音还不够。"},"贴近-内收-清醒":{"title":"守着暗号的人","lit":"佩内洛普等了二十年，白天织寿衣夜里就拆掉，一屋子求婚者全被挡在她的心事之外。她要人陪，但她要的那个人有名有姓；她心里翻涌，可所有盘算都在灯下独自完成。真正的验证只有一道：那张用活橄榄树做的床，位置只有他们两个人知道。你也是这样爱的，你要得很具体，想得很安静，认定一个人就不回转。","plain":"你心里有一张床的位置，只对一个人公开。","song":"王菲《红豆》","gradient":"linear-gradient(135deg,#8E5572,#C48CA9)","p1":"你要人陪，但从不来者不拒；你心事很多，但很少摆在脸上，所有的盘算都在心里悄悄完成。你认人认得极准，一旦认定，那份忠诚就不会轻易动摇，只是外人很难看出你其实用了多少心思去确认这件事。你的浪漫是具体的，落在一个只有你和对方才懂的细节里，甜言蜜语反倒入不了你的眼。","p2":"懂得等待、也愿意跟你一起守住一个只属于两个人的默契的人，他不需要你天天表白，能从你安静的坚持里读懂分量。不要等要求你随时表态、把沉默当成敷衍的人，他等不到你织完那件心事就会先失去耐心。你的另一半应当明白，你认得准，认了就不会轻易改。"},"贴近-内收-观望":{"title":"写五百封信的人","lit":"卡夫卡给菲莉斯写过五百多封信，最多的时候一天三封。纸上的他滚烫又诚实，可两次订婚都被他自己退掉了。想一个人想到失眠，又怕真的得到；千言万语，全在信里，不在门口。你熟悉这种病，靠近的欲望是真的，往回缩的手也是真的。也许该记得，菲莉斯把那些信保存了一辈子。被你用这种笨办法爱过的人，其实收得到。","plain":"你敢写一万字，不敢按一次门铃。","song":"陈粒《小半》","gradient":"linear-gradient(135deg,#7D5A7E,#B08BB5)","p1":"你想一个人的时候能想得很深，纸上或屏幕里的你滚烫又诚实，字字句句都掏心掏肺。可真到了要往前一步、要把关系落到实处的时候，你反而会犹豫，甚至主动往后退。这种拉扯的根源，是你太害怕靠得太近之后失去分寸，怪不到三心二意头上。你把最真的自己交给了文字，却总在见面那一刻收回一点勇气。","p2":"愿意读懂你写下的每一句、也愿意在你退缩时轻轻拉你一把的人，才走得进你的心，他不会因为你不敢按门铃就判定你不认真，而是明白你的深情本就落在纸上。没耐心等你靠近、把犹豫直接当成拒绝的人，就不用勉强了，他会在你还没写完时就转身离场。你需要一个愿意先向你走近一步的人，剩下的路，你会补上。"},"贴近-悬置-炽热":{"title":"长着四根刺的玫瑰","lit":"B612的那朵玫瑰有四根刺，开口就是\"我才不怕老虎\"，可她连风都受不住。她要他留下，偏说\"你走吧\"；委屈攒了一朵花那么多，一句也没谈过，等人自己看出来。小王子走了很久才明白，那些没说出口的底下只有一句\"别走\"。你也一样，在意到骨子里，却把每一次难过都轻轻挂起。愿你的那个人，明白得早一点。","plain":"你说\"没事\"，四根刺下面全是\"别走\"。","song":"林宥嘉《说谎》","gradient":"linear-gradient(135deg,#C1554D,#E0A05F)","p1":"你在意一个人的时候在意到骨子里，可嘴上说出来的永远和心里想的相反。委屈攒了一整朵花那么多，你也只会说\"没事\"\"你走吧\"，等对方自己去猜背后的意思。这份别扭说穿了，是你太怕直接说出\"别走\"之后，得到的是一句敷衍。你把最柔软的部分裹在刺里，因为那是你唯一会的保护方式。","p2":"愿意多想一步、听得出你反话背后的真心的人，才配走近你，他不会被你的刺扎退，反而会耐心等你把话说顺。听到\"你走吧\"就真的转身走、从不深究一句的人，趁早远离，他会把你的委屈原封不动地留在原地。你需要一个愿意陪你把刺一根根放下的人，光看表面可读不懂你。"},"贴近-悬置-清醒":{"title":"住在围城里的人","lit":"钱锺书说婚姻是围城，城外的人想冲进去，城里的人想逃出来。方鸿渐一路都看得明白，却一步也没处理过：该拒绝的拖着，该抓住的看着，吵完的架从不复盘，日子将错就错地过下去。你也有这种本事：道理全懂，人也离不开人，只是每个该谈的问题，都被你挂在了\"改天再说\"上。城不是牢，钥匙一直在你兜里。","plain":"你什么都看得穿，就是什么都不想谈。","song":"陈奕迅《红玫瑰》","gradient":"linear-gradient(135deg,#96616B,#C9A0A6)","p1":"你把感情里的道理看得透透的，谁对谁错、问题出在哪里，你心里门儿清。可看得明白和愿意处理是两回事，你更习惯把该谈的事情往后拖，能糊弄过去就糊弄过去。你太清楚认真谈开之后可能要面对更麻烦的局面，宁可留着一点模糊换一份安稳，并不是真的不在乎。你离不开人，却总在关键的对话前踩刹车。","p2":"愿意主动把问题摊开来聊、又不会因为你的回避而立刻翻脸的人，最能帮到你，他能耐心等你把话说完，也能替你把拖延的部分往前推一推。要避开那种同样喜欢回避、遇事就搁置的人，你们会把小问题一起攒成大问题。你需要一个愿意先开口的人，把你兜里那把钥匙拿出来用一用。"},"贴近-悬置-观望":{"title":"揣着半块陶片的人","lit":"古希腊人说重逢要靠symbolon——一块陶片掰成两半，各执一片，对上茬口才认得出彼此。你把所有心事都做成了陶片：想确认对方还在，就先假装自己要走；想问\"你在乎吗\"，出口就成了\"我无所谓\"。委屈从来只挂着，试探却没停过。你从不担心谜太难，你担心的是来对茬口的人不够耐心。","plain":"你确认对方还在的方式，是先假装自己要走。","song":"徐佳莹《言不由衷》","gradient":"linear-gradient(135deg,#8A5A83,#BE93BE)","p1":"你很少直接问出心里真正想问的那句话，想确认对方还在不在乎，出口的却常是一句\"我无所谓\"。这种拧巴是你的自我保护，先说狠话，是怕先受伤的人是自己。你其实很念旧，也很认真，只是不敢把这份认真直接摆到台面上，怕对方转身就走，更怕自己白付出。","p2":"耐心足够、愿意读懂你反着说的话、并主动核对你真实心意的人，才接得上你的茬口，他不会被你一句\"随便\"劝退，反而会多留一会儿看一看。要避开那种听风就是雨、一句气话就当真离开的人，他会让你的试探彻底落空。你需要一个愿意花时间对茬口的人，图省事的人对不上你。"},"弹性-外放-炽热":{"title":"当垆卖酒的人","lit":"卓文君的爱情有三段章法。琴声一动，当夜就敢私奔；家道断供，就当垆卖酒，绫罗换粗布，眼睛都不眨；等司马相如动了二心，一首《白头吟》递过去：\"闻君有两意，故来相决绝。\"爱得起，弯得下，也翻得了脸。你就是这种爱法：跟着境遇变形，但从不变质；话永远当面说，包括最狠的那句。","plain":"你什么日子都能陪着过，但两意你一天也不忍。","song":"娃娃《漂洋过海来看你》","gradient":"linear-gradient(135deg,#C96A3B,#E8B25A)","p1":"日子好过、日子难过，你都能陪着一起过，甚至越是艰难的时候你越豁得出去。你的爱能跟着境遇变形，粗布也好绫罗也好，你都不含糊。但这份宽容有底线，一旦对方动了二心，你翻脸也翻得干脆，不留情面。你不怕吃苦，怕的是被糊弄。","p2":"同样敢在现实面前不退缩、认定一个人就肯共担风雨的人，配得上你的这份豪气，他要懂得珍惜你这份不计较，而不是把你的包容当成理所当然。要避开那种三心二意、把感情当备胎的人，你的底线不会给他第二次机会。你需要一个能跟你一起扛事、也一样重承诺的人。"},"弹性-外放-清醒":{"title":"最诚实的豪猪","lit":"叔本华讲过一群冬夜里的豪猪：离太远会冷，凑太近扎人，只好在两种疼之间来回挪，直到找到刚好的距离。你就是那只最诚实的豪猪——想要温暖直说，扎到人也直认，从不假装自己没有刺，也不假装自己不冷。这份坦白，本身就是你的取暖方式。","plain":"你想要的温度和你竖起的刺，一直在当面讨价还价。","song":"郭顶《水星记》","gradient":"linear-gradient(135deg,#7A6FA0,#A99BC9)","p1":"你对亲密的需求很诚实，想靠近就直说，扎到人了也认账，从不装作自己没有脾气或者不需要陪伴。这份坦白让你在感情里显得很好懂，也让你敢在受伤后继续调整距离，而不是一走了之。你不追求完美的相处方式，只追求一个双方都能忍受的刚好距离，这已经很难得。","p2":"同样愿意坦诚沟通、被扎一下也肯说出来而不是憋着走人的人，最适合跟你相处，他能跟你一起慢慢找那个合适的距离。要避开那种要么把距离逼得太近、要么一被刺就彻底沉默消失的人，他没耐心陪你磨合。你需要一个愿意跟你反复商量距离的人，单方面的妥协撑不成长久。"},"弹性-外放-观望":{"title":"久而敬之的人","lit":"孔子夸晏婴只用了七个字：善与人交，久而敬之。多少交情都是越处越随便，他偏能把距离守成礼数。话说得直，君王也照谏；心放得稳，谁也别想一步到他跟前。你也是这种交法：坦率是真坦率，设防也是真设防，感情在你这里要慢火验收；验收通过的，你敬他一辈子。","plain":"你谁都处得来，但\"走近\"两个字，要按年计费。","song":"莫文蔚《慢慢喜欢你》","gradient":"linear-gradient(135deg,#6E7DA2,#9BAECB)","p1":"你交朋友容易，深交却很慢，感情这件事在你这里要经过一段不短的观察期。你说话直，遇到不对的事也敢当面指出来，同时你也给自己留着一道防线，不会轻易让谁一步跨进来。这不是冷淡，是你把尊重看得比亲近更重要，验收通过之后，你反而会敬对方一辈子。","p2":"不急于求成、愿意花时间陪你走完这段观察期的人，才走得到你心里，他经得起考验，也懂得欣赏你这份稳重而不是催促你快点。要避开那种要求速食关系、几次约会就要你交出全部信任的人，他等不到你敬他的那一天。你需要一个愿意慢慢来、也值得你慢慢敬重的人。"},"弹性-内收-炽热":{"title":"踩着刀尖跳舞的人","lit":"小人鱼用声音换了双腿，每一步都像踩在刀尖上，可她还是去了，还笑着跳舞。她把最重要的话押给了女巫，把最深的疼藏进舞步，爱得倾尽所有，疼得一声不吭。你也有这种温柔的狠劲：为一个人调整自己的形状，代价自己扛，账单自己收。只是别忘了故事的教训：话都没说，最后连泡沫都替你委屈。","plain":"你为爱换形状，连疼都自己消化。","song":"周深《大鱼》","gradient":"linear-gradient(135deg,#3E7A8C,#7FC0C9)","p1":"你愿意为一个人调整自己，甚至付出很大的代价，而且习惯自己扛下所有的疼，笑着把最难的部分藏起来。这份温柔背后是一种很深的狠劲，你舍得为爱吃苦，却舍不得让对方看见你在吃苦。别人常常只看到你笑着跳舞的样子，没看到你脚底下的刀尖。","p2":"细心、愿意主动问你疼不疼的人，才该留在你身边，他能看穿你笑容底下的代价，并且愿意分担，而不是心安理得地享受你的付出。要避开那种理所当然接受你的牺牲、从不回头看你的人，他会让你一个人扛到最后。你需要一个愿意替你分一半疼、也看得见你脚下刀尖的人。"},"弹性-内收-清醒":{"title":"游刃有余的人","lit":"庖丁解牛十九年，刀刃还像新磨的。他从来不硬砍，只顺着牛身上本来的纹理走，遇到筋骨盘结处就放慢手：\"怵然为戒，视为止，行为迟。\"你处理感情也是这个手法：顺着对方的纹理来，紧要处放轻放慢，所有用心都收在手上。相处这门手艺你练到了游刃有余，只是你的从容太安静，容易被当成不用心，偶尔也让人看看刀光。","plain":"你把感情处理得太顺滑，顺滑到没人发现你在用功。","song":"五月天《温柔》","gradient":"linear-gradient(135deg,#6B8E78,#A3C9A8)","p1":"你处理感情的手法很老练，顺着对方的性子来，遇到棘手的地方懂得放慢脚步，很少硬碰硬。这份从容背后，是你花了很多心思去琢磨怎么让关系走得顺畅，天生冷静的人未必肯下这个功夫。问题在于你做得太不着痕迹，容易被人误会成不上心，其实你的用心都收在看不见的地方。","p2":"细心、愿意主动去看见你安静付出的人，才不会辜负你，他不会把你的从容当成理所当然，而是懂得偶尔问一句你到底花了多少心思。要避开那种粗线条、只认得轰轰烈烈才叫在乎的人，他会长期忽略你的用心。你需要一个愿意读懂你不动声色里的认真的人。"},"弹性-内收-观望":{"title":"服冷香丸的人","lit":"宝钗的热毒要用冷香丸压着。雨水那天的雨、白露那天的露，攒齐了才配得成一副药。她谁都处得妥帖，什么都看得分明，可心里那点热，从来只按剂量释放。你也是：温度是有的，甚至比谁都高，但你信不过\"一次给完\"这种给法，宁可慢慢配药，慢慢观察，等一个值得停药的人。","plain":"你的热情要配着药吃，一次只肯化一丸。","song":"田馥甄《寂寞寂寞就好》","gradient":"linear-gradient(135deg,#7B8A8E,#AEBFC2)","p1":"你心里的热度其实不低，甚至比很多人都高，只是你从不一次性交出来，习惯慢慢释放，慢慢观察。你把人情世故处理得妥帖周全，谁都挑不出错处，可这份周全底下藏着一颗很认真的心，只是要等一个值得的人，才肯把药停下来。","p2":"有耐心、愿意等你慢慢打开的人，才配得上你这份热度，他不会催你一次性交付所有热情，反而愿意陪你一步步来。要避开那种要求立刻看到全部证明、等不及就认定你冷淡的人，他会在你配好药之前先转身。你需要一个值得你为他停药的人。"},"弹性-悬置-炽热":{"title":"把心事演成喜剧的人","lit":"《城市之光》里，流浪汉为盲女去做苦工、挨拳头，转身在她面前永远是那个体面的\"富翁\"。爱得倾家荡产，演得若无其事。卓别林说，人生近看是悲剧，远看是喜剧。你深谙此道：难过的事讲成段子，要紧的话混进玩笑，满场的气氛都由你照看，唯独自己的委屈永远排不上片期。可结尾她一摸到他的手就认出来了。你看，装得再好，真心是有指纹的。","plain":"你把心碎讲成段子，观众笑了，你也当自己没事了。","song":"薛之谦《丑八怪》","gradient":"linear-gradient(135deg,#A85B8B,#E09461)","p1":"你擅长把难过讲成段子，把最要紧的话混进玩笑里说出来，整个场子的气氛你都能照顾到，唯独自己的委屈总是排到最后。你只是太习惯把体面留给自己扛，哪里谈得上没心没肺。你爱一个人可以爱到倾尽所有，转身却装得若无其事，好像什么都没发生过。","p2":"细心、能从你的玩笑里听出弦外之音的人，才是你需要的人，他不只是坐在台下笑的观众，愿意在笑声停下来之后问你一句\"你还好吗\"。只看你表演、从不深究你真实状态的人就算了，他会让你一直演下去。你需要一个愿意摸到你手心、认出你真心的人。"},"弹性-悬置-清醒":{"title":"朝堂里的隐士","lit":"东方朔管自己的活法叫\"避世于朝堂\"。站在天子眼前当隐士，什么局都能周旋，什么真话都裹在玩笑里递出去，对方当真了他就笑，当他闹着玩他也笑。你也是热闹场里的隐居者：分寸拿捏得极准，谁也挑不出错，可谁也碰不到底。看得太明白的人容易这样活，凡事留三分，把自己活成一个滴水不漏的玩笑。只是玩笑说到第三层，也盼着有人肯掀开听听。","plain":"你在人群里隐居，正事全用玩笑打包。","song":"李宗盛《凡人歌》","gradient":"linear-gradient(135deg,#8B6FA6,#C4A0DC)","p1":"你在人群里游刃有余，分寸拿捏得极准，什么话该说、什么话该裹进玩笑里递出去，你心里都有数。这份周旋是真本事，说明你看得清局面也看得懂人心，绝不是敷衍。只是你把自己藏得太好，久而久之，连你自己也很少被真正看穿。","p2":"有耐心、愿意陪你把玩笑一层层剥开的人，才配听到你的真话，他不会满足于你给出的表面答案，而是愿意花时间等你卸下防备。要避开那种只接受你玩笑面孔、从不追问真话的人，他会让你一直躲在人群里。你需要一个愿意听你把话说到第三层的人。"},"弹性-悬置-观望":{"title":"只留下微笑的猫","lit":"柴郡猫想来就来，想走就走，走的时候身子先消失，微笑最后消失。爱丽丝问路，它答\"那要看你想去哪儿\"，句句在场，句句不落地。你也是这种存在：跟谁都聊得来，跟谁都不交底，问到要紧处就笑，笑完话题就飘走了。没人抓得住你，这是你的自由，也是你的孤本。毕竟一直悬在半空的微笑，偶尔也想有棵树枝落一落。","plain":"你永远在场，又永远不落地。","song":"陈绮贞《旅行的意义》","gradient":"linear-gradient(135deg,#8C8AA8,#C3B8D8)","p1":"你跟谁都聊得来，气氛总能被你带得很好，可真正要紧的问题一来，你就笑着把话题带走。没人能轻易抓住你的底细，这既是你的自由，也是你保护自己的方式。你享受这种若即若离，但心里其实清楚，一直悬在半空也会累。","p2":"给你空间、不追问到底、却愿意在你身边一直待着不走的人，才留得住你，他有足够的耐心等你自己落下来，而不是逼你现在就交底。要避开那种急着定义关系、受不了你飘忽就直接放弃的人，他会在你还没落地前就先走开。你需要一个愿意等你落在同一根树枝上的人。"},"疏离-外放-炽热":{"title":"把家安在沙漠的人","lit":"三毛把家安在撒哈拉。爱要爱得滚烫，人要活得自由，两样她都不肯让。想荷西了就大声写进书里给全世界看，想一个人了就把门关上，谁也别来。爱和自由在她那里从来相安无事，因为她要的东西一直很具体：\"我选的人，在我选的沙漠里。\"你也是这种烈法：热情是真的，领地也是真的。谁要你在爱里交出自己，你宁可回沙漠去。","plain":"你爱得很大声，但你的门牌号只有一个人知道。","song":"齐豫《橄榄树》","gradient":"linear-gradient(135deg,#B26E3F,#E0B15E)","p1":"你爱一个人爱得很大声，想念就写出来给全世界看，这份热情从不藏着掖着。但同时你极其看重自己的领地，谁想让你在爱里交出全部自我，你宁可退回自己的沙漠。爱和自由在你这里从来不是对立的两件事，你要的只是被爱的同时依然做自己。","p2":"懂得给你留空间、也享受被你大声爱着的人，才配得上你的热情，他不会把你的独立当成不够爱他的证据。要避开那种控制欲强、要求你随时汇报行踪的人，他会把你的沙漠一点点填平，直到你再没地方可退。你需要一个愿意站在你门牌号那头、却不闯进你院子的人。"},"疏离-外放-清醒":{"title":"住在木桶里的人","lit":"第欧根尼住在木桶里，亚历山大问他要什么赏赐，他说：你让开，别挡我的太阳。全希腊没有比这更清醒的一句话。王座、盛名、别人挤破头的东西，他只要自己那一小片阳光。你也是：话说得笔直，账算得明白，自己的日子过得清清楚楚。谁想进你的木桶，先得懂一件事：你缺的从来不是人，是不挡光的人。","plain":"你什么都不缺，就缺一个不挡你太阳的人。","song":"崔健《一无所有》","gradient":"linear-gradient(135deg,#4A6FA5,#7BA3C8)","p1":"你把日子过得清清楚楚，账目分明，说话也从不拐弯，不需要靠别人来填满自己的时间。你也需要陪伴，只是看得很清楚，大多数人凑近只会挡住你原本晒得好好的太阳。你不缺人来人往，缺的是一个真正合拍、不添乱的人。","p2":"独立、懂得分寸、愿意安静陪着你而不占用你所有时间的人，才是你能长久相处的人，他不需要你时刻回应，自己也有自己的太阳要晒。要避开那种黏人、需要你不断证明爱意的人，他会成为那个真正挡光的人。你需要一个懂得让开、也懂得留下的人。"},"疏离-外放-观望":{"title":"用直钩钓鱼的人","lit":"渭水边那根鱼钩是直的，离水三尺，不挂饵——姜太公等的从来不是鱼，是一个看得懂直钩的人。你也是：不追，不弯，愿者上钩；等不到就收竿走人，连水面都不惊动。后来文王亲自来了。你看，直钩钓走的是最大的那条。","plain":"你的钩子是直的，愿者上钩，不愿的你也懒得弯。","song":"张国荣《我》","gradient":"linear-gradient(135deg,#48788C,#7FAFC4)","p1":"你在感情里从不主动追，也不刻意讨好，愿者上钩，等不到就收竿离开，连神色都不太起波澜。这份平静源于你太清楚勉强来的东西留不住，清高二字倒谈不上。你把耐心留给懂得欣赏你的人，其余的，你连解释都懒得给。","p2":"懂得欣赏你这份不迎合、愿意主动走近你的人，才配得上你的直钩，他看得懂你的诚意，不会嫌你不够热络。需要你不断证明魅力、逼你放下身段去追的人，离你远一点，他等不到你弯钩，你也不会为他弯。你需要一个像文王一样，愿意亲自来找你的人。"},"疏离-内收-炽热":{"title":"把话种成树的人","lit":"归有光写到最重的地方，只有一句：庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。没有一个情字，却是中文里最沉的一行。你说要紧的话也走这条路——种下去，不解释，让时间替你长。能在树荫底下站定、抬头看懂年轮的人，就是你等的人。","plain":"你最深的话种在院子里，自己长成了树荫。","song":"李健《贝加尔湖畔》","gradient":"linear-gradient(135deg,#4F7A5B,#8DB483)","p1":"你心里最重的话，很少直接说出口，你更习惯用行动把它种下去，让时间替你证明。旁人可能觉得你沉默寡言，其实你的深情一直都在，只是长得比较慢，需要有人愿意等它长成树荫。你不擅长表白，却很擅长坚持。","p2":"有耐心、愿意在树苗还小的时候就陪着浇水的人，才等得到你长成的样子，他懂得读你不说出口的部分，也不嫌你安静。要避开那种只认口头承诺、等不及看年轮的人，他会在树长大之前就先走掉。你需要一个愿意在树荫底下站很久的人。"},"疏离-内收-清醒":{"title":"树下自成蹊的人","lit":"司马迁写李广，用了八个字：桃李不言，下自成蹊。树不吆喝，果子是真的，一年一年，树底下自己踩出一条路来。你也是这样活的——不宣传，不解释，把话说得跟果子一样实，然后安安静静等路自己长出来。急不得，可长出来的路都不会消失。","plain":"你从不吆喝，可你脚下的路是人一步一步踩出来的。","song":"朴树《平凡之路》","gradient":"linear-gradient(135deg,#6A8A5E,#A8C48E)","p1":"你不擅长也不喜欢自我推销，从不主动证明自己有多好，只是把该做的事情做扎实，剩下的交给时间。这种沉稳让你显得很可靠，也容易让人一开始低估你的分量。你不急，你知道真实的东西经得起等待。","p2":"耐心观察、愿意用时间验证你的人，才走得进你的世界，他不需要你天天表态，会自己看懂你走过的路。要避开那种只看表面热闹、没耐心等一条路慢慢踩出来的人，他会在路成形之前就转身离开。你需要一个愿意陪你把路走完的人。"},"疏离-内收-观望":{"title":"荆棘深处的人","lit":"城堡外的荆棘长了一百年，扎退了所有心不诚的——那圈刺是筛子，沉睡是谜面，吻是唯一的密钥。你把自己收在最里面等，门槛立得高，不为拒客，为筛人。要怪就怪童话说得太对：荆棘认得出谁是来真的，到时候会自己让路。","plain":"你的城墙是荆棘，你的门是谜语，你在最里面等一个不怕扎的。","song":"张韶涵《阿刁》","gradient":"linear-gradient(135deg,#556274,#8A9BB0)","p1":"你把自己收在很深的地方，门槛立得很高，目的只是筛掉那些不够认真的人。你需要很长的时间和很确定的信号才敢卸下防备，这份谨慎让你显得难以接近，说穿了是你太怕交错了心。","p2":"有耐心、不怕被扎、愿意一次次穿过你的防线证明自己的人，才能走到你中心，他经得起时间考验，也懂得你的谨慎只是一种筛选方式。走两步就喊疼、遇到一点阻力就放弃的人不必费心，他到不了你的城堡中心。你需要一个不怕扎、愿意等你亲自开门的人。"},"疏离-悬置-炽热":{"title":"弹广陵散的人","lit":"嵇康在洛阳城外打铁，钟会远道来访，他头也不抬，连\"为什么不理世界\"这个问题，他都懒得理。所有人都以为他冷，直到刑场上他要来一张琴，弹了一遍《广陵散》，说：这曲子，从今以后绝了。你也是这样收藏自己的：平时门关着，事挂着，谁也别想撬开；可你心里始终养着一首最烈的曲子，只肯弹给配得上的时刻。别把它留到最后一刻才弹。","plain":"你不是冷，你是把最烈的那首曲子留着没弹。","song":"Beyond《海阔天空》","gradient":"linear-gradient(135deg,#6E4A5E,#A87A8A)","p1":"你平时看起来很淡，门关着，事挂着，别人很难走近你的内心，但你心里其实一直养着一份很浓烈的情感，只是轻易不肯拿出来示人。你把最珍贵的部分留给真正配得上的时刻，宁可攒着，也不肯轻易挥霍，这跟冷漠是两回事。","p2":"有耐心、不会因为你平时的淡然就认定你没有感情的人，才配听到你那首曲子，他愿意等，也愿意在你终于开口的那一刻认真听。只看表象、觉得你冷就早早放弃的人趁早绕开，他会一直听不到你那首曲子。你需要一个愿意早点走近你、听你从头弹完这首曲子的人。"},"疏离-悬置-清醒":{"title":"相忘于江湖的人","lit":"泉水干了，两条鱼困在车辙里相濡以沫，庄子看了却说：不如相忘于江湖。这话听着凉薄，其实清醒得很。他懂那口沫里的深情，他更心疼两条鱼都回不了水。你也是这么看感情的：与其在窘迫里互相消耗，不如各自游回宽处去，该断的都交给江湖。只是庄子没说完：江湖那么大，也容得下两条自由的鱼，偶尔游进同一片水。","plain":"你不是不深情，你是见不得两个人在浅水里耗着。","song":"于文文《体面》","gradient":"linear-gradient(135deg,#3E6E72,#78A8A2)","p1":"你对感情有一种通透的心疼，看到两个人在窘迫里互相消耗，你会觉得不如各自游开，回到宽处呼吸。这份克制里全是你太懂那份沫里的深情有多沉重，才舍不得看着两个人一起困死，跟薄情半点不沾边。你的退让常常是心疼的另一种说法。","p2":"同样看重彼此空间、不会把黏在一起当成爱的唯一证明的人，最能陪你走长久，他懂得分开有时候是为了走得更久。要避开那种把你的克制解读成不在乎、非要天天黏着才安心的人，他会误会你最深的那份体谅。你需要一个愿意和你各自游一段、又能在宽处重逢的人。"},"疏离-悬置-观望":{"title":"不发声明的月亮","lit":"李商隐替嫦娥写了句\"应悔偷灵药\"，可广寒宫从没发过一个字的声明。她住得那么远，远到所有故事都由别人替她讲：说她后悔，说她孤独，说她在等谁。她一概不确认，也一概不否认。你也把自己挂在这样的高度，让想懂你的人自己走完那段夜路。只是月亮也该知道，有人肯抬头看一辈子。","plain":"你挂得太高，故事全是别人替你编的。","song":"邓丽君《月亮代表我的心》","gradient":"linear-gradient(135deg,#4A5A6A,#7A8A9A)","p1":"你把自己放在一个比较远的位置，很少主动解释自己，任由外界去猜测、去议论，别人说什么，你都随他们说去。你早就习惯了独自消化，也习惯了不指望别人真的懂，这跟无所谓是两码事。你在等一个愿意抬头看很久、慢慢看懂你的人。","p2":"有耐心、愿意花很长时间自己走近你、不轻信外界传言的人，才走得到你身边，他能读懂你的沉默，不会道听途说就下结论。没耐心弄清真相、只愿意相信别人怎么说的人，你大可不必理会，他永远走不到你身边。你需要一个愿意抬头看你一辈子的人。"}}};

function render() {

    for (let k = 0; k < sec.count; k++, qi++) {

      html += `<div class="q-card" id="qcard-${qi}">

        <div class="q-label"><span class="q-num-badge">Q${num}</span><span class="q-text">${q.t}</span></div>

  html += `<div class="actions">
    <button class="btn-primary" onclick="generate()">✦ 生成我的分析报告</button>
    <div class="progress-count" id="countLabel">已回答 0 / ${DATA.QS.length} 题</div>
    <p class="actions-note">可以多选，再点一次即取消。至少回答 10 题才能生成报告。</p>
  </div>
  <div id="resultSection">
    <div class="result-card">
      <div class="result-head" id="resultHead">
        <div class="result-head-tag">DEEP NIGHT · 深夜问卷</div>
        <h2 id="resultTitle"></h2>
        <div class="song-line" id="songLine"></div>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>`;
  app.innerHTML = html;
}

function pick(qi, oi) {
  let arr = answers[qi];
  if (!arr) { arr = answers[qi] = []; }
  const at = arr.indexOf(oi);
  if (at >= 0) { arr.splice(at, 1); if (arr.length === 0) answers[qi] = null; }
  else { arr.push(oi); }
  const sel = answers[qi] || [];
  document.getElementById(`qcard-${qi}`).classList.toggle('answered', sel.length > 0);
  [0,1,2,3].forEach(i => {
    const el = document.getElementById(`opt-${qi}-${i}`);
    if (el) el.classList.toggle('selected', sel.includes(i));
  });
  updateProgress();
}

function updateProgress() {
  const filled = answers.filter(a => a && a.length > 0).length;
  document.getElementById('progressFill').style.width = (filled / DATA.QS.length * 100) + '%';
  document.getElementById('countLabel').textContent = `已回答 ${filled} / ${DATA.QS.length} 题`;
}

// ─── JUDGE ──────────────────────────────────────────────────────────────────
function tallyVotes(ans) {
  const counts = {};
  AXIS_SEQ.forEach(ax => { counts[ax] = {}; AXIS_ORDER[ax].forEach(t => counts[ax][t] = 0); });
  for (let qi = 0; qi < DATA.VOTES.length; qi++) {
    const row = DATA.VOTES[qi];
    if (!row) continue;
    const sel = ans[qi];
    if (!sel || sel.length === 0) continue;
    sel.forEach(oi => {
      (row[oi] || []).forEach(v => {
        const p = v.split(':');
        counts[p[0]][p[1]]++;
      });
    });
  }
  return counts;
}

function decideAxis(axis, counts, ans) {
  const tiers = AXIS_ORDER[axis];
  const c = counts[axis];
  const maxVal = Math.max(c[tiers[0]], c[tiers[1]], c[tiers[2]]);
  let tied = tiers.filter(t => c[t] === maxVal);
  if (tied.length === 1) return tied[0];

  // 裁决一：定锚题内、仅在平票档之间重新计票
  const anchorCounts = {};
  tied.forEach(t => anchorCounts[t] = 0);
  ANCHORS[axis].forEach(qi => {
    const row = DATA.VOTES[qi];
    if (!row) return;
    const sel = ans[qi];
    if (!sel || sel.length === 0) return;
    sel.forEach(oi => {
      (row[oi] || []).forEach(v => {
        const p = v.split(':');
        if (p[0] === axis && tied.indexOf(p[1]) >= 0) anchorCounts[p[1]]++;
      });
    });
  });
  const anchorMax = Math.max.apply(null, tied.map(t => anchorCounts[t]));
  const tied2 = tied.filter(t => anchorCounts[t] === anchorMax);
  if (tied2.length === 1) return tied2[0];
  if (tied2.length > 1) tied = tied2;

  // 裁决二：按定锚题先后，取第一道"恰好只投给平票档之一"的题
  for (const qi of ANCHORS[axis]) {
    const row = DATA.VOTES[qi];
    if (!row) continue;
    const sel = ans[qi];
    if (!sel || sel.length === 0) continue;
    const hit = new Set();
    sel.forEach(oi => {
      (row[oi] || []).forEach(v => {
        const p = v.split(':');
        if (p[0] === axis && tied.indexOf(p[1]) >= 0) hit.add(p[1]);
      });
    });
    if (hit.size === 1) return hit.values().next().value;
  }

  // 裁决三：固定档序兜底
  for (const t of tiers) if (tied.indexOf(t) >= 0) return t;
  return tiers[0];
}

function judge(ans) {
  const counts = tallyVotes(ans);
  const modes = AXIS_SEQ.map(ax => decideAxis(ax, counts, ans));
  return { key: modes.join('-'), modes: modes };
}

// ─── RESULT ─────────────────────────────────────────────────────────────────
function generate() {
  const filled = answers.filter(a => a && a.length > 0).length;
  if (filled < 10) {
    alert(`还差一点哦，至少答 10 题才能生成（现在答了 ${filled} 题）`);
    return;
  }
  const res = judge(answers);
  const profile = DATA.PROFILES[res.key];
  if (!profile) { alert('生成出了点问题，请重试'); return; }

  const resultSection = document.getElementById('resultSection');
  resultSection.style.display = 'block';
  document.getElementById('resultHead').style.background = profile.gradient;
  document.getElementById('resultTitle').textContent = profile.title;
  document.getElementById('songLine').innerHTML = `<span>♪</span><span>${profile.song}</span>`;

  const bars = res.modes.map((mode, i) => {
    const idx = AXIS_ORDER[AXIS_SEQ[i]].indexOf(mode);
    return `<div class="axis-bar"><span class="axis-dot" style="left:${DOT_POS[idx]}%;background:${profile.gradient}"></span></div>`;
  }).join('');

  document.getElementById('resultBody').innerHTML = `
    <div class="mod-block"><span class="mod-chip">性格分析</span><div class="mod-text">${profile.p1}</div></div>
    <div class="mod-block"><span class="mod-chip">适合恋爱的对象</span><div class="mod-text">${profile.p2}</div></div>
    <div class="lit-text">${profile.lit}</div>
    <div class="plain-card">${profile.plain}</div>
    <div class="axis-bars">${bars}</div>
    <div class="regen-row">
      <button class="btn-regen" onclick="document.getElementById('resultSection').style.display='none'; window.scrollTo({top:0,behavior:'smooth'})">重新作答</button>
    </div>`;
  resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
